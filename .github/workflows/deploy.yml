name: Build and deploy

# The site rebuilds from `docs.json` on the package repository's main branch,
# not from a published release. Documentation changes therefore never require an
# npm publish — that coupling is what turned six doc edits into six burned
# version numbers.
#
# There is deliberately no cross-repository dispatch from the library — that
# would need a personal access token, and the same reasoning that keeps the
# drift guard credential-free applies here. The daily schedule picks up merged
# changes; "Run workflow" is the immediate path.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to build docs for. Leave empty for the current main."
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies to install — the generator is plain Node.
      #
      # DOCS_BASE is the repository variable that lets the site work on the
      # GitHub Pages *project* URL, which serves below the domain root. Delete
      # the variable once docs.thefintechbuilder.com points here and every link
      # becomes root-relative again — no code change.
      - name: Build
        env:
          DOCS_BASE: ${{ vars.DOCS_BASE }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node build.mjs --version "${{ inputs.version }}"
          else
            node build.mjs
          fi

      # A partial site is worse than a stale one: refuse to deploy if the topic
      # pages did not materialise.
      - name: Sanity-check the output
        run: |
          pages=$(find dist -name index.html | wc -l)
          echo "built $pages pages"
          if [ "$pages" -lt 100 ]; then
            echo "::error::only $pages pages built — refusing to deploy"
            exit 1
          fi
          test -f dist/sitemap.xml && test -f dist/llms.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
